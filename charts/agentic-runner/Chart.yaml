apiVersion: v2
name: agentic-runner
description: >-
  The Agentic OS Runner (ADR-0013): an activity-only Temporal worker an Organisation
  installs in its own cluster. N replicas are N Runners with N identities under one
  Recipient Key; every Contract on a Runner is its own OS user (ADR-0015).
type: application
