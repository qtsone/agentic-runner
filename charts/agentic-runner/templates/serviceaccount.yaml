apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentic-runner.fullname" . }}
  labels:
    {{- include "agentic-runner.labels" . | nindent 4 }}
# Only the init container that ensures the Recipient Key Secret needs the API; it mounts
# a projected token of its own, and the Runner container gets none.
automountServiceAccountToken: false
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
# The Recipient Key Secret is created by whichever replica boots first and read by the
# rest (22 A4): `get` on that one name, `create` on Secrets (a create cannot be scoped
# to a resourceName), nothing wider.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentic-runner.fullname" . }}-recipient-key
  labels:
    {{- include "agentic-runner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "agentic-runner.recipientKeySecret" . | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentic-runner.fullname" . }}-recipient-key
  labels:
    {{- include "agentic-runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentic-runner.fullname" . }}-recipient-key
subjects:
  - kind: ServiceAccount
    name: {{ include "agentic-runner.fullname" . }}
    namespace: {{ .Release.Namespace }}
