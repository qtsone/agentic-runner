{{- $token := include "agentic-runner.registrationToken" . | fromYaml }}
{{- if not $token.existingSecret }}
{{- if not $token.value }}
{{- fail "registrationToken.value or registrationToken.existingSecret is required: mint a Runner Registration Token on the Organisation Console Runners page (PRD issue 41)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-runner.registrationTokenSecret" . }}
  labels:
    {{- include "agentic-runner.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token.value | quote }}
{{- end }}
