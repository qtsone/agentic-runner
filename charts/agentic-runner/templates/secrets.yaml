{{- if not .Values.agentToken.existingSecret }}
{{- if not .Values.agentToken.value }}
{{- fail "agentToken.value or agentToken.existingSecret is required: mint one on the Organisation Console Runners page (PRD issue 41)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-runner.agentTokenSecret" . }}
  labels:
    {{- include "agentic-runner.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.agentToken.value | quote }}
{{- end }}
