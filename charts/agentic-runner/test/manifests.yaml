# The chart test's neighbours (PRD issue 46): the conformance kit's fake control plane,
# served from the Runner image itself (`python -m agentic_runner.testing`), and a Temporal
# dev server holding the one namespace the fake hands out.
apiVersion: v1
kind: Namespace
metadata:
  name: runner-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-control-plane
  namespace: runner-test
spec:
  replicas: 1
  selector:
    matchLabels: {app: fake-control-plane}
  template:
    metadata:
      labels: {app: fake-control-plane}
    spec:
      containers:
        - name: fake
          image: agentic-runner:test
          imagePullPolicy: Never
          # The funder's OpenAI key the chart test's one API-key Directive spends.
          command:
            - python
            - -m
            - agentic_runner.testing
            - "8000"
            - --deliver
            - OPENAI_API_KEY=sk-chart-test-funder-key
          ports: [{containerPort: 8000}]
          volumeMounts: [{name: chart-test, mountPath: /chart-test}]
      volumes:
        - name: chart-test
          configMap: {name: chart-test}
---
apiVersion: v1
kind: Service
metadata:
  name: fake-control-plane
  namespace: runner-test
spec:
  selector: {app: fake-control-plane}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: runner-test
spec:
  replicas: 1
  selector:
    matchLabels: {app: temporal}
  template:
    metadata:
      labels: {app: temporal}
    spec:
      containers:
        - name: temporal
          image: temporalio/admin-tools:1.32.0
          command:
            - temporal
            - server
            - start-dev
            - --ip=0.0.0.0
            - --port=7233
            - --headless
            - --namespace=org-00000000-0000-0000-0000-000000000001
          ports: [{containerPort: 7233}]
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: runner-test
spec:
  selector: {app: temporal}
  ports: [{port: 7233, targetPort: 7233}]
