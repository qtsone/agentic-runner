[project]
name = "agentic-runner"
description = "The Agentic OS Runner: an activity-only Temporal executor for workspaces, Agent Runtimes and verb seams"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
  "agentic-runner-contracts",
  # Imported directly by `registration.py` (the Ed25519 identity that signs every
  # heartbeat); already present transitively through pyjwt[crypto], declared because
  # we import it.
  "cryptography>=50,<51",
  "httpx>=0.27,<1.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "pyjwt[crypto]>=2.13.0",
  "temporalio>=1.10,<2.0",
]

[project.optional-dependencies]
# The conformance kit (`agentic_runner.testing`, docs/conformance.md): the fake control
# plane needs nothing beyond the dependencies above; the scenario suite needs these.
testing = [
  "pytest>=9.1,<9.2",
  "pytest-asyncio>=0.24,<1.0",
]

[project.scripts]
agentic-runner = "agentic_runner.cli:main"

[project.entry-points.pytest11]
agentic_runner = "agentic_runner.testing.plugin"

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agentic_runner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_runner"]

[tool.uv.sources]
agentic-runner-contracts = { workspace = true }
